[package]
name = "rust_life_sim"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.130"
rand = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'wasm32-unknown-unknown']
dependencies = { getrandom = { version = "0.4.3", features = ["wasm_js"] } }
